<script>
const D = {"A_pobp": {"t": "pOBP \u2014 porcine odorant-binding protein gene", "arm": "Track A \u2014 protocol sheets pOBP-1..4", "p": "The gene encoding porcine OBP in a T7/IPTG-inducible His-tagged bacterial expression vector (e.g. pET).", "c": ["pOBP expression plasmid (pET-based, His-tagged)"], "tl": ["-20/-80 C freezer", "NanoDrop"], "proc": [["note", "Starting plasmid (pOBP-pET, His-tagged). No bench procedure \u2014 proceed to Transform BL21 (expression) and Transform DH5\u03b1 (backup). Full arm: protocol sheets pOBP-1 to pOBP-4."]]}, "A_bl21": {"t": "Transform BL21(DE3)", "arm": "protocol sheet pOBP-1", "p": "Introduce pOBP plasmid into the BL21(DE3) expression strain (carries T7 RNA polymerase).", "c": ["Competent BL21(DE3)", "pOBP plasmid (1-10 ng)", "SOC/LB", "LB-agar + antibiotic"], "tl": ["42 C water bath", "37 C shaker", "LB-agar plates", "Spreader"], "proc": [["step 1", "Thaw competent BL21(DE3) on ice 10 min. Add 1-10 ng pOBP-pET plasmid; mix gently; ice 20-30 min."], ["step 2", "Heat shock 42 C for 10 s (BL21 is more fragile than DH5a -- keep it short); return to ice 2 min."], ["step 3", "Add 450 uL SOC; recover 37 C, 250 rpm, 1 h."], ["step 4", "Plate 50-100 uL on LB-agar + antibiotic; 37 C overnight."]]}, "A_main": {"t": "Maintain (BL21 culture)", "arm": "protocol sheet pOBP-1", "p": "Grow a starter culture to log phase before induction.", "c": ["LB broth + antibiotic", "Single colony"], "tl": ["37 C shaker (250 rpm)", "Culture tubes", "OD600 spec"], "proc": [["step 5", "Pick a single fresh colony into 5 mL LB + antibiotic. Shake 37 C, 250 rpm, overnight (do not over-grow)."]]}, "A_expr": {"t": "Protein express (induction)", "arm": "protocol sheet pOBP-1", "p": "Induce pOBP with IPTG at OD600 ~0.6; express at 37 C (fast) or 18 C overnight (better folding).", "c": ["IPTG (0.1-1 mM)", "LB + antibiotic"], "tl": ["Shaker (37 C / 18 C)", "OD600 spec", "Centrifuge"], "proc": [["step 6", "Dilute the starter 1:100 into 200-500 mL fresh LB + antibiotic in a flask."], ["step 7", "Grow 37 C, 250 rpm to OD600 = 0.5-0.7 (~2-3 h). Take a 1 mL \"uninduced\" sample for the gel."], ["step 8", "Induce with IPTG to 0.5 mM final."], ["step 9", "Express EITHER 4 h at 37 C, OR shift to 18 C and express 16-18 h. Low temperature favours soluble, correctly folded pOBP and reduces inclusion bodies."], ["step 10", "Take a 1 mL \"induced\" sample for the gel. Harvest the rest by centrifugation (4000 x g, 15 min, 4 C)."], ["step 11", "Discard supernatant; store the cell pellet at -20 C (or proceed directly to purification, sheet pOBP-2)."]]}, "A_pur": {"t": "Purify & extract pOBP", "arm": "protocol sheet pOBP-2", "p": "Lyse cells and purify His-tagged pOBP by nickel-affinity chromatography.", "c": ["Lysis buffer (Tris/NaCl)", "Ni-NTA resin", "Imidazole (wash 20 / elute 250 mM)", "PMSF"], "tl": ["Sonicator/French press", "Ni-NTA column / FPLC", "Refrigerated centrifuge", "SDS-PAGE rig", "Desalting column"], "proc": [["step 1", "Resuspend the cell pellet in cold lysis buffer + PMSF (+ optional lysozyme/DNase). Keep everything on ice."], ["step 2", "Lyse by sonication on ice (e.g. 10 s on / 30 s off cycles until clarified). Avoid foaming/overheating."], ["step 3", "Centrifuge 20,000 x g, 30 min, 4 C. Keep the supernatant (soluble pOBP); save a pellet sample for the gel."], ["step 4", "Equilibrate Ni-NTA resin in lysis buffer. Load the clarified supernatant (batch-bind 1 h at 4 C, or flow through a column)."], ["step 5", "Wash with 10-20 column volumes of wash buffer (20 mM imidazole) until A280 of the flow-through returns to baseline."], ["step 6", "Elute pOBP with 250 mM imidazole. Collect fractions."], ["step 7", "Run elution fractions on SDS-PAGE; pool the clean ~18-20 kDa fractions."], ["-- Delipidation (important) --", ""], ["step 8", "Remove bacterial lipids from the cavity: pass the pooled protein over Lipidex-1000 at 37 C, OR perform gentle organic extraction. This empties the binding pocket so it can take up your target VOCs."], ["step 9", "Buffer-exchange into assay buffer (PD-10 or dialysis) to remove imidazole and residual solvent."], ["step 10", "Quantify (A280 with pOBP extinction coefficient, or BCA). Concentrate to ~0.5-1 mM if needed. Aliquot, snap-freeze, store -80 C."], ["-- QC --", ""], ["Purity", "Single Coomassie band at ~18-20 kDa; confirm identity by western blot (sheet pOBP-3)."], ["Function", "Confirm the cavity is empty and binding-competent with the 1-AMA assay (sheet pOBP-4) before using pOBP to deliver odorants."]]}, "A_sol": {"t": "Solubilize odor (pOBP + VOC)", "arm": "Track A -> feeds Track B", "p": "Mix purified pOBP with hydrophobic VOCs in aqueous buffer; pOBP binds and keeps them soluble for delivery to the cell sensor.", "c": ["Purified pOBP", "VOC analyte", "Assay buffer", "DMSO (<=0.1%)"], "tl": ["Vortex", "Glass amber vials", "Pipettes"], "proc": [["1", "Prepare VOC stock in DMSO/methanol (carrier <=1%)."], ["2", "Mix purified, delipidated pOBP with VOC in assay buffer."], ["3", "Incubate briefly at RT to allow binding."], ["4", "Use as the odorant-delivery solution feeding the calcium assay (Track B, sheet 12)."]]}, "A_wb": {"t": "Western blot (verify protein)", "arm": "protocol sheet pOBP-3", "p": "Confirm pOBP size/identity by SDS-PAGE + anti-His immunoblot.", "c": ["SDS-PAGE gel + buffers", "PVDF membrane", "Anti-His primary + HRP secondary", "Blocking buffer", "ECL substrate"], "tl": ["SDS-PAGE + transfer rig", "Chemiluminescence imager"], "proc": [["step 1", "Run purified pOBP (and an induced-lysate lane) on a 12-15% SDS-PAGE gel."], ["step 2", "Transfer to methanol-activated PVDF (wet or semi-dry)."], ["step 3", "Block in 5% BSA/TBST, 1 h RT (or 4 C overnight)."], ["step 4", "Incubate anti-His primary (1:2000-1:5000 in blocking buffer), 1 h RT."], ["step 5", "Wash 3 x 5 min in TBST."], ["step 6", "Incubate HRP secondary (1:5000-1:10000), 1 h RT."], ["step 7", "Wash 3 x 5 min in TBST."], ["step 8", "Apply ECL substrate; image. A single band at ~18-20 kDa confirms His-tagged pOBP."], ["-- Controls --", ""], ["Negative", "Uninduced lysate -- should show no/low band."], ["Loading", "Run a duplicate Coomassie gel for total-protein purity."]]}, "A_bind": {"t": "1-AMA competitive binding", "arm": "protocol sheet pOBP-4", "p": "pOBP binds 1-AMA with bright fluorescence; a real odorant displaces it and signal drops, confirming the protein binds odorants.", "c": ["Purified pOBP", "1-aminoanthracene (1-AMA)", "Competing VOC", "Buffer (Tris pH 7.4)"], "tl": ["Fluorescence reader (ex295/em480)", "Quartz cuvette / black plate"], "proc": [["-- A. 1-AMA binding curve (Kd of reporter) --", ""], ["step 1", "Fix pOBP at ~1-2 uM in assay buffer in the cuvette/well."], ["step 2", "Titrate 1-AMA in steps (e.g. 0-10 uM). After each addition, record fluorescence (ex 295 / em 480)."], ["step 3", "Plot fluorescence vs [1-AMA]; fit to get the dissociation constant Kd of 1-AMA for pOBP. Pick a working 1-AMA concentration near saturation for step B."], ["-- B. Competitive displacement (rank VOCs) --", ""], ["step 4", "Pre-load pOBP with 1-AMA at the working concentration; record the high baseline fluorescence."], ["step 5", "Titrate in a competing VOC. As the VOC displaces 1-AMA from the cavity, fluorescence drops."], ["step 6", "Plot fluorescence vs [VOC]; the concentration giving 50% displacement is the IC50. Convert to Ki using the 1-AMA Kd (Cheng-Prusoff)."], ["step 7", "Repeat for each candidate VOC. Lower IC50/Ki = tighter binding = pOBP carries that odorant better."], ["-- Controls --", ""], ["Blank", "Buffer + 1-AMA, no pOBP -- low fluorescence (confirms signal needs the protein)."], ["Vehicle", "Add the same solvent volume without VOC -- corrects for any dilution/solvent quenching."]]}, "A_dh5": {"t": "Transform DH5\u03b1 (backup)", "arm": "Track A (pOBP backup)", "p": "Amplify and archive the pOBP plasmid in DH5\u03b1, separate from the expression strain.", "c": ["Competent DH5\u03b1", "pOBP plasmid", "LB-agar + antibiotic"], "tl": ["42 C water bath", "37 C incubator"], "proc": [["1", "Thaw competent DH5\u03b1 on ice 10 min."], ["2", "Add 1-10 ng pOBP plasmid; ice 20-30 min."], ["3", "Heat shock 42 C 45 s; ice 2 min."], ["4", "Recover in LB/SOC 37 C 1 h."], ["5", "Plate on LB-agar + antibiotic; 37 C overnight."]]}, "A_stock": {"t": "Stock \u00d72 (glycerol)", "arm": "backup / QC", "p": "Cryopreserve two glycerol stocks at -80 C.", "c": ["Overnight culture", "Sterile 50% glycerol"], "tl": ["Cryovials", "-80 C freezer", "Liquid N2"], "proc": [["1", "Mix 500 uL overnight culture + 500 uL sterile 50% glycerol in a cryovial."], ["2", "Snap-freeze in liquid N2."], ["3", "Store at -80 C (make two vials)."]]}, "A_maint": {"t": "Maintain (working culture)", "arm": "backup / QC", "p": "Keep a working culture/plate for immediate use.", "c": ["LB + antibiotic"], "tl": ["37 C shaker", "Culture tubes"], "proc": [["1", "Streak/inoculate from a verified colony into LB + antibiotic."], ["2", "Grow 37 C; keep at 4 C short-term."]]}, "A_verif": {"t": "Verify plasmid", "arm": "backup / QC", "p": "Confirm the pOBP plasmid by digest + gel and/or Sanger.", "c": ["Restriction enzymes + buffer", "Agarose/TAE/SYBR Safe/ladder", "Sequencing primers"], "tl": ["Thermocycler", "Gel rig + imager"], "proc": [["1", "Digest plasmid with diagnostic enzymes; run on agarose gel."], ["2", "Submit for Sanger sequencing across the ORF."], ["3", "Confirm size + sequence before expression."]]}, "A_v2": {"t": "Verify plasmid (in BL21)", "arm": "backup / QC", "p": "Confirm the plasmid in BL21 before induction.", "c": ["Restriction enzymes + buffer", "Agarose/TAE/SYBR Safe/ladder", "Sequencing primers"], "tl": ["Thermocycler", "Gel rig + imager"], "proc": [["1", "Miniprep the BL21 transformant."], ["2", "Diagnostic digest + gel, and/or Sanger."], ["3", "Confirm correct before induction."]]}, "B_vec": {"t": "Customize Vector", "arm": "Track B (overview)", "p": "OR/ORCO in a CMV-driven mammalian vector (pTwist CMV BG WPRE Neo). Ready for HEK293 \u2014 no sub-cloning.", "c": ["OR plasmid (Or67b-mCherry)", "ORCO-GCaMP6 plasmid"], "tl": ["-20/-80 C freezer", "NanoDrop"], "proc": [["note", "Starting plasmid (CMV-driven, mammalian-ready). No bench procedure \u2014 proceed to Transform DH5\u03b1."]]}, "B_dh5": {"t": "Transform DH5\u03b1", "arm": "protocol sheet 03", "p": "Introduce each plasmid into competent DH5\u03b1 for amplification (heat shock).", "c": ["Competent DH5\u03b1", "Plasmid DNA (1-10 ng)", "LB/SOC", "LB-Amp100 plates", "Ampicillin"], "tl": ["42 C water bath", "37 C shaker", "Spreader"], "proc": [["step 1", "Thaw 50 uL competent DH5a on ice for 10 min. DO NOT warm with hands."], ["step 2", "Add 1-5 uL plasmid DNA (1-100 ng) to the cells. Gently swirl tube -- NO PIPETTING up/down (shears cells)."], ["step 3", "Incubate on ice 20-30 min. DNA-binding step."], ["step 4", "Heat shock: 42 C water bath for EXACTLY 45 s. Use a timer. Longer kills cells."], ["step 5", "Immediately return to ice for 2 min."], ["step 6", "Add 450 uL LB (or SOC) at room temperature."], ["step 7", "Recover at 37 C, 250 rpm for 1 h. Cells need this time to express the bla gene BEFORE they meet ampicillin."], ["step 8", "Plate 100 uL on a pre-warmed LB-Amp100 plate. Spread with a sterile spreader or glass beads."], ["step 9", "Invert plate, incubate 37 C overnight (16-18 h)."], ["step 10", "Count colonies. Expect 50-1000 per plate from 10 ng of circular plasmid. If 0 colonies, see Notice."], ["-- Controls --", ""], ["Positive", "Same protocol with 1 ng pUC19 -- proves competent cells work."], ["Negative", "No DNA added -- should give 0 colonies. Colonies here -> antibiotic plate is bad."]]}, "B_pur": {"t": "Purify (miniprep)", "arm": "protocol sheet 04", "p": "Alkaline-lysis silica-column miniprep for clean plasmid DNA.", "c": ["Buffer S1 (+RNase A)", "Buffer S2 (NaOH/SDS)", "Buffer S3 (KOAc)", "Wash W1/W2", "Elution buffer"], "tl": ["Microcentrifuge", "Silica columns", "NanoDrop", "Heat block 55 C"], "proc": [["step 1", "Pellet 1.5 mL overnight culture in 1.5-mL tube, 14 k rpm, 1 min. Discard supernatant. Repeat with another 1.5 mL into the same tube (total 3 mL processed)."], ["step 2", "Add 200 uL Buffer S1 + RNase A. Vortex / pipette to fully resuspend -- no visible clumps."], ["step 3", "Add 200 uL Buffer S2. Invert 6-8 times. Solution becomes clear/blue and viscous. DO NOT vortex. Wait < 5 min total."], ["step 4", "Add 300 uL Buffer S3. Invert 6-8 times. A thick white precipitate (proteins + chrDNA + SDS) appears."], ["step 5", "Centrifuge 14 k rpm, 8 min, room temperature."], ["step 6", "Carefully transfer supernatant (~700 uL) to a silica spin column. Avoid the white pellet."], ["step 7", "Centrifuge 14 k rpm, 30 s. Discard flow-through."], ["step 8", "Add 400 uL Buffer W1. Centrifuge 14 k rpm, 30 s. Discard flow-through."], ["step 9", "Add 600 uL Buffer W2. Centrifuge 14 k rpm, 30 s. Discard flow-through."], ["step 10", "EXTRA dry spin: 14 k rpm, 2 min. Removes residual ethanol -- critical for downstream enzymes."], ["step 11", "Transfer column to a new clean 1.5-mL tube. Add 50 uL elution buffer (or 55 C ddH2O) directly to the centre of the membrane. Wait 2 min."], ["step 12", "Centrifuge 14 k rpm, 2 min. Eluate = your plasmid."], ["step 13", "Measure on NanoDrop: load 1 uL. Acceptable: A260/A280 = 1.8-2.0; A260/A230 > 2.0; concentration 50-200 ng/uL."], ["step 14", "Store at -20 C. Aliquot if you will freeze-thaw repeatedly."]]}, "B_verif": {"t": "Verify (digest + gel + Sanger)", "arm": "protocol sheets 05, 06, 08", "p": "Confirm each construct: digest for insert size, gel to visualise, Sanger to confirm sequence.", "c": ["Restriction enzymes (NotI, XbaI) + buffer", "Agarose/1x TAE/SYBR Safe", "Ladder, loading dye", "Sequencing primers"], "tl": ["Thermocycler", "Gel rig + imager", "Sanger service"], "proc": [["Digest", "Set up a diagnostic restriction digest (e.g. NotI + XbaI), 37 C 1 h, heat-inactivate."], ["Gel", "Run digest on 1% agarose / SYBR Safe at 100 V; compare bands to expected sizes."], ["Sanger", "Submit plasmid + primers (CMV-F etc.) for Sanger; align reads to confirm the ORF and junctions."], ["note", "Full detail: protocol sheets 05 (digest), 06 (gel), 08 (Sanger)."]]}, "B_stock": {"t": "Stock \u00d72 (glycerol)", "arm": "protocol sheet 01", "p": "Cryopreserve two glycerol stocks of each verified clone.", "c": ["Overnight culture", "Sterile 50% glycerol"], "tl": ["Cryovials", "-80 C freezer", "Liquid N2"], "proc": [["1", "Mix 500 uL overnight culture + 500 uL sterile 50% glycerol in a cryovial."], ["2", "Snap-freeze in liquid N2."], ["3", "Store -80 C (two vials)."]]}, "B_maint": {"t": "Maintain (working culture)", "arm": "protocol sheet 01", "p": "Keep a working LB-Amp culture for the next steps.", "c": ["LB + ampicillin"], "tl": ["37 C shaker", "Culture tubes"], "proc": [["1", "Pick a verified colony into 5 mL LB-Amp100."], ["2", "Shake 37 C, 250 rpm, 12-16 h."], ["3", "Use for miniprep or keep at 4 C short-term."]]}, "B_hek": {"t": "HEK293 culture", "arm": "protocol sheet 09", "p": "Maintain HEK293/HEK293T in log-phase, ready to seed at 60-70% confluence.", "c": ["DMEM (high glucose)", "FBS (tet-free) 10%", "Pen/Strep", "TrypLE", "PBS (Ca/Mg-free)"], "tl": ["CO2 incubator", "Biosafety cabinet", "Inverted microscope", "Centrifuge", "Hemocytometer"], "proc": [["-- Recovery from frozen --", ""], ["R.1", "Thaw cryovial at 37 C water bath, ~1 min, until just a small ice chip remains."], ["R.2", "Transfer 1 mL of cells to a 15-mL tube containing 9 mL pre-warmed DMEM-10%FBS."], ["R.3", "Centrifuge 1000 rpm, 5 min, RT. Aspirate supernatant (removes DMSO)."], ["R.4", "Resuspend in 5 mL DMEM-10%FBS-1%P/S. Transfer to a T-25 flask."], ["R.5", "Incubate 37 C, 5% CO2 overnight. Check attachment next morning."], ["-- Routine passaging --", ""], ["P.1", "Pre-warm medium, PBS, TrypLE at 37 C for 20 min."], ["P.2", "Aspirate spent medium from flask."], ["P.3", "Wash with 5 mL PBS (T-25) or 8 mL (T-75). Aspirate."], ["P.4", "Add 1 mL TrypLE (T-25) or 3 mL (T-75). Incubate 37 C, 3-5 min."], ["P.5", "Tap flask to dislodge cells. Confirm under microscope."], ["P.6", "Add 4 mL DMEM-10%FBS (T-25) or 7 mL (T-75) to inactivate TrypLE."], ["P.7", "Transfer to 15-mL tube. Centrifuge 1000 rpm, 5 min. Aspirate."], ["P.8", "Resuspend pellet in 1 mL DMEM-10%FBS-1%P/S."], ["P.9", "Count cells; seed new flask at 0.5-1 x 10^6 cells per T-25 (split 1:5 to 1:10)."], ["-- Freezing --", ""], ["F.1", "Harvest cells (P.1-P.7). Count."], ["F.2", "Resuspend at 1-2 x 10^6 cells/mL in 90% FBS + 10% DMSO."], ["F.3", "Aliquot 1 mL per cryovial. Place in Mr. Frosty / isopropanol box, -80 C overnight (1 C/min cooling)."], ["F.4", "Transfer to liquid N2 for long-term storage."]]}, "B_cotx": {"t": "Co-transfect (electroporation)", "arm": "protocol sheet 10", "p": "Deliver OR + ORCO-GCaMP6 into HEK293 by electroporation: cells in suspension + a high-voltage pulse. ~5 ug DNA per ~1-5 x 10^6 cells, 2:1 OR:ORCO. No lipid reagent or Opti-MEM.", "c": ["Endotoxin-free, low-salt, concentrated plasmid DNA", "Electroporation / nucleofection buffer (Lonza Kit V/SF or EP buffer)", "DMEM-10%FBS, pre-warmed, no antibiotics (recovery)", "Doxycycline (if inducible ORCO)"], "tl": ["Electroporator / Nucleofector (Lonza 4D / Bio-Rad Gene Pulser / Neon)", "Electroporation cuvettes / Nucleocuvettes", "Centrifuge + hemocytometer", "Fluorescence microscope (mCherry/GFP)"], "proc": [["-- Day 0: prepare cells --", ""], ["step 1", "Grow HEK293/HEK293T to log phase (~70-80% confluent, >90% viability). Detach with TrypLE, neutralise, and count."], ["step 2", "Pellet the required cells (~1-5 x 10^6 per reaction) at 200 x g, 5 min. Wash once in PBS to remove serum/salt, and pellet again."], ["-- Day 0: electroporate --", ""], ["step 3", "Resuspend each cell pellet in 100 uL electroporation/nucleofection buffer. Work quickly -- cells should not sit in buffer long."], ["step 4", "Add the DNA mix: ~5 ug total at 2:1 OR : ORCO-GCaMP6 (e.g. 3.3 ug OR + 1.7 ug ORCO). Keep added DNA volume small (concentrated, low-salt) to avoid arcing."], ["step 5", "Transfer to a cuvette/Nucleocuvette (no bubbles). Apply the pulse using your device's HEK293 program. Typical starting points to CONFIRM/OPTIMISE on your machine:"], ["Nucleofection (Lonza)", "4D-Nucleofector with SF Cell Line kit, program CM-130 or DS-150; or Amaxa II with Kit V, program Q-001 / A-023. Follow the kit manual."], ["Cuvette (Bio-Rad Gene Pulser)", "Exponential ~250 V / 950 uF in a 4 mm cuvette; or square-wave per the manual. Optimise voltage for viability vs efficiency."], ["Tip electroporation (Neon)", "~1100-1150 V, 20 ms pulse width, 2 pulses (published HEK293 settings); optimise on your unit."], ["step 6", "IMMEDIATELY add ~0.5-1 mL pre-warmed antibiotic-free DMEM-10%FBS to the cuvette and gently transfer cells to a flask/plate with more warm medium. Do not pipette harshly -- pulsed cells are fragile."], ["step 7", "Return to 37 C, 5% CO2. Seed to your assay format (e.g. into wells for the calcium assay, or a flask for stable selection)."], ["-- Day 1 --", ""], ["step 8", "24 h post-pulse, change to fresh DMEM-10%FBS-1%P/S. If using an inducible promoter, add doxycycline to 1 ug/mL."], ["step 9", "Check mCherry on the fluorescence microscope. Nucleofection of HEK293 typically gives high efficiency (often 50-80%); confirms the OR plasmid is in."], ["-- Day 2 (48 h) --", ""], ["step 10", "Check GCaMP6 baseline green (low -- brightens on Ca2+) and mCherry (bright)."], ["step 11", "EITHER proceed to the Ca2+ assay for transient measurements (sheet 12), OR start G418 selection for stable lines (sheet 11)."], ["-- Controls --", ""], ["Control 1", "Pulse with NO DNA (buffer only) -- tests electroporation toxicity / baseline viability."], ["Control 2", "GFP-only plasmid -- positive control for electroporation efficiency."], ["Control 3", "ORCO-GCaMP6 alone, no tuning OR -- should respond to VUAA1 but not VOCs."]]}, "B_eff": {"t": "Transfection efficiency", "arm": "protocol sheet 10 controls", "p": "24-48 h post-transfection, estimate % mCherry+ cells before committing to selection.", "c": ["(imaging only)", "optional GFP control"], "tl": ["Fluorescence microscope", "or flow cytometer"], "proc": [["1", "24-48 h after transfection, view cells under fluorescence microscope."], ["2", "Estimate % mCherry+ cells (10-40% typical for lipid methods)."], ["3", "If >5-10% positive, proceed to selection; if not, troubleshoot transfection."]]}, "B_stab": {"t": "Stable line (G418 + FACS)", "arm": "protocol sheet 11", "p": "Select integrants with G418, then FACS-sort mCherry+ cells into 96-well plates for monoclonal expansion.", "c": ["G418 100->150 ug/mL", "DMEM-10%FBS-1%P/S", "PBS"], "tl": ["CO2 incubator", "Cell sorter (FACSAria)", "96-well plates", "Microscope"], "proc": [["-- Bulk selection --", ""], ["step 1", "48 h after transfection (sheet 10), aspirate medium and replace with DMEM-10%FBS-1%P/S + 100 ug/mL G418."], ["step 2", "Change selection medium every 2-3 days. Non-transfected cells die within 5-10 days."], ["step 3", "After 2 weeks, raise G418 to 150 ug/mL and select 1 more week."], ["step 4", "When cells divide vigorously under selection (no dead cells, no doxycycline) -- you have a stable POOL."], ["-- FACS sorting (monoclonal lines) --", ""], ["step 5", "Trypsinise stable pool. Resuspend in 1 mL DMEM-10%FBS at 5 x 10^6 cells/mL. Filter through 40-um mesh to break clumps."], ["step 6", "On sorter: gate FSC/SSC (live) -> mCherry+ -> singlet -> sort 1 cell per well into 96-well plates pre-filled with 200 uL DMEM-10%FBS-150 ug/mL G418."], ["step 7", "Sort 2 x 96-well plates per OR (~50 candidate clones per OR after expected ~25% survival)."], ["step 8", "Incubate plates at 37 C, 5% CO2. Inspect weekly under inverted microscope. Colonies appear by day 7-14."], ["step 9", "When a well is 50-80% confluent, trypsinise and expand to 24-well, then 6-well, then T-25."], ["step 10", "When you have ~5-10 candidate clones expanded, run a small Ca2+ assay (sheet 12) with VUAA1 to identify the functional ones -- not all clones respond despite mCherry positivity (Zboray 2023: only 7/12 ORs gave responsive lines)."], ["step 11", "Cryopreserve 5-10 vials of each functional clone (sheet 09 F.1-F.4). This is your working stock for all subsequent assays."]]}, "B_ca": {"t": "Calcium assay", "arm": "protocol sheet 12", "p": "The nose readout: inject VUAA1 + VOCs onto cells in 384-well plate, record GCaMP6 fluorescence rise.", "c": ["Assay buffer (NaCl/KCl/CaCl2/MgCl2/HEPES/glucose)", "VUAA1 (50 uM)", "Reference VOCs", "DMSO (<=0.1%)"], "tl": ["Plate reader + injector (ex485/em535)", "384-well plate", "Multichannel pipette"], "proc": [["-- Day -2 (seeding) --", ""], ["step 1", "Trypsinise stable HEK293-OR cells. Count."], ["step 2", "Resuspend at 6 x 10^5 cells/mL in DMEM-10%FBS-1%P/S (+ 1 ug/mL doxycycline if inducible)."], ["step 3", "Seed 25 uL per well of 384-well plate = 15 000 cells/well. Layout: 3 columns per OR line, each row = one VOC."], ["step 4", "Incubate 48-72 h at 37 C, 5% CO2."], ["-- Day 0 (assay) --", ""], ["step 5", "Pre-warm assay buffer and VOC stocks at 37 C."], ["step 6", "In a fume hood, prepare VOC dilutions in VOC dilution buffer at 4x final concentration: e.g. 4x final 50 uM = 200 uM stock (Zboray protocol uses 4x stock with 9 uL injection)."], ["step 7", "Carefully aspirate growth medium from each well (cells are adherent but loose). Add 20 uL assay buffer per well with multichannel. Avoid bubbles."], ["step 8", "Equilibrate 5 min at 37 C in the reader."], ["step 9", "Run protocol: read F0 baseline for 5 s. Inject 9 uL VOC stock (or buffer for blank). Continue reading at 1 read/s for 30 s. Total well time = 35 s."], ["step 10", "Per plate, ALWAYS include one row of 50 uM VUAA1 (positive control) -- this is the normaliser."], ["step 11", "Export raw data (RFU vs time). Extract F0 (mean of pre-injection 5 s) and F_max (peak in 30 s post-injection). Compute dF/F0 = (F_max - F0) / F0."], ["step 12", "Normalise to VUAA1: VUAA1-normalised response = (dF/F0 of VOC) / (mean dF/F0 of VUAA1). Per Zboray, responses < 0.05 are background (call 0)."], ["step 13", "For dose-response: test each VOC at 12 concentrations (0.01-100 uM), 3 technical replicates, 3 biological days. Fit Hill equation (Hill slope = 1, max = 1) -> EC50."], ["-- Negative controls (every plate) --", ""], ["N.1", "Buffer-only injection -- baseline drift."], ["N.2", "Untransfected HEK293 + 50 uM VUAA1 -- ORCO-independent artefact check."], ["N.3", "OR cell line + Ca2+-free buffer (replace CaCl2 with 1 mM EGTA) -- confirms signal is from extracellular Ca2+ influx (Zboray Suppl. Fig. S3)."]]}, "B_vuaa": {"t": "VUAA1 control", "arm": "protocol sheet 12", "p": "VUAA1 activates ORCO regardless of tuning OR \u2014 universal positive control + normaliser on every plate.", "c": ["VUAA1 (50 uM)", "Assay buffer"], "tl": ["Plate reader + injector"], "proc": [["1", "Include one row of 50 uM VUAA1 on every assay plate."], ["2", "Read fluorescence rise \u2014 VUAA1 activates ORCO in all OR lines."], ["3", "Use the VUAA1 response to normalise all VOC responses on that plate."]]}};
function show(id){
 const d=D[id]; if(!d) return;
 document.getElementById('c_title').textContent=d.t;
 const arm=document.getElementById('c_arm'); arm.textContent=d.arm;
 const isA=id.startsWith('A_'); arm.className='arm'+(isA?' a':'');
 document.getElementById('c_purpose').textContent=d.p;
 const ch=document.getElementById('c_chem'); ch.innerHTML='';
 d.c.forEach(x=>{const li=document.createElement('li');li.textContent=x;ch.appendChild(li);});
 const tl=document.getElementById('c_tools'); tl.innerHTML='';
 d.tl.forEach(x=>{const li=document.createElement('li');li.textContent=x;tl.appendChild(li);});
 const pc=document.getElementById('c_proc'); pc.innerHTML=''; pc.className=isA?'a':'';
 let ol=null;
 (d.proc||[]).forEach(([lbl,txt])=>{
   if(lbl==='note'){ if(ol){pc.appendChild(ol);ol=null;} const p=document.createElement('p'); p.style.cssText='font-size:12px;color:#888;font-style:italic;margin:8px 0 0'; p.textContent=txt; pc.appendChild(p); return; }
   if(txt===''){ if(ol){pc.appendChild(ol);ol=null;} const h=document.createElement('div'); h.className='phead'; h.textContent=lbl.replace(/^-+\s*|\s*-+$/g,''); pc.appendChild(h); return; }
   if(!ol) ol=document.createElement('ol'), ol.className='proc';
   const li=document.createElement('li');
   const sp=document.createElement('span'); sp.className='stepnum'; sp.textContent=lbl; li.appendChild(sp);
   li.appendChild(document.createTextNode(txt)); ol.appendChild(li);
 });
 if(ol) pc.appendChild(ol);
 document.getElementById('overlay').classList.add('show');
 document.getElementById('card').scrollTop=0;
}
function hide(){document.getElementById('overlay').classList.remove('show');}
document.querySelectorAll('.node').forEach(g=>{const id=g.getAttribute('data-id');
 g.addEventListener('click',()=>show(id));
 g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(id);}});});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide();});
</script>
</body></html>
